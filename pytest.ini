[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: 單元測試（引擎純函數）
    api: API 契約測試
    e2e: 端到端 UI 測試
    zombies_z: Zero 類
    zombies_o: One 類
    zombies_m: Many 類
    zombies_b: Boundaries
    zombies_i: Interfaces
    zombies_e: Exceptions
    zombies_s: Simple scenarios
    slow: 執行較久的案例
    regression: 回歸測試（L9/L10 護欄）
addopts =
    -ra
    --strict-markers
    --tb=short
